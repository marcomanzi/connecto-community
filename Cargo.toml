[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.8"
edition = "2024"
rust-version = "1.95"
publish = false
license = "AGPL-3.0-only"
homepage = "https://connecto.studio"

[workspace.dependencies]
connecto-adapter = { path = "crates/connecto-adapter" }
connecto-automation = { path = "crates/connecto-automation" }
connecto-audit = { path = "crates/connecto-audit" }
connecto-core = { path = "crates/connecto-core" }
connecto-gate = { path = "crates/connecto-gate" }
connecto-hook = { path = "crates/connecto-hook" }
connecto-net = { path = "crates/connecto-net" }
connecto-packages = { path = "crates/connecto-packages" }
connecto-pty = { path = "crates/connecto-pty" }
connecto-redact = { path = "crates/connecto-redact" }
connecto-secrets = { path = "crates/connecto-secrets" }
connecto-session = { path = "crates/connecto-session" }
connecto-store = { path = "crates/connecto-store" }
connecto-term = { path = "crates/connecto-term" }
connecto-ui = { path = "crates/connecto-ui" }
connecto-update = { path = "crates/connecto-update" }
connecto-workspace = { path = "crates/connecto-workspace" }
alacritty_terminal = "0.26"
arc-swap = "1.9"
crossbeam-channel = "0.5"
eframe = "0.37"
egui = "0.37"
interprocess = { version = "2.4", default-features = false }
libproc = "0.14"
nix = { version = "0.28", default-features = false }
portable-pty = "0.9"
serde_json = "1"
sha2 = "0.11"
sysinfo = { version = "0.40", default-features = false }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
