[package]
name = "connecto-hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
homepage.workspace = true

[lints]
workspace = true

[[bin]]
name = "connecto-hook"
path = "src/bin/connecto-hook.rs"

[dependencies]
serde_json.workspace = true

# `connecto op run`: the operation's own process group, given the terminal
# and its signals (ADR 0031).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["process", "signal", "term"] }
signal-hook = "0.4"

# A named-pipe server for the Windows transport tests (the client is std only).
[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "1", features = ["net", "rt", "io-util", "time"] }

[target.'cfg(unix)'.dev-dependencies]
tempfile = "3"
