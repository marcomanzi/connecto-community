[package]
name = "connecto-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
connecto-core.workspace = true
connecto-secrets.workspace = true
connecto-term.workspace = true
crossbeam-channel.workspace = true
sha2.workspace = true
thiserror.workspace = true
serde_json.workspace = true
arc-swap.workspace = true
getrandom = "0.3"
zeroize = "1"
spake2 = "0.4"
argon2 = "0.6"
hmac = "0.13"
ssh-key = { version = "0.6", features = ["std", "ed25519", "ecdsa", "rsa", "rand_core"] }
ssh-agent-client-rs = "1"
connecto-redact.workspace = true
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "portmapper"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[features]
# Lets a test accept the self-signed certificate of an in-process relay. Never
# on in the app. Enabled only by the dev-dependency below, so a shipped build
# never carries it; `scripts/release/check-release-features.sh` enforces that
# for every release build (see ADR 0022). It is not refused at compile time,
# because `cargo test --release` must build.
test-relay = ["iroh/test-utils"]

[dev-dependencies]
connecto-net = { path = ".", features = ["test-relay"] }
connecto-audit.workspace = true
connecto-gate.workspace = true
iroh-relay = { version = "1.4", default-features = false, features = ["server", "test-utils", "tls-ring"] }
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "portmapper", "test-utils"] }
connecto-session.workspace = true
connecto-pty.workspace = true
