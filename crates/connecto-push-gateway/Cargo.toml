[package]
name = "connecto-push-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Hands Connecto hosts' Siri notifications to APNs (research_notes/siri-intents/push-gateway.md)."

[lints]
workspace = true

[features]
default = ["server"]
# The gateway itself. Without it, only `auth`: what a host needs to sign.
server = [
  "dep:tokio",
  "dep:hyper",
  "dep:hyper-util",
  "dep:http-body-util",
  "dep:bytes",
  "dep:p256",
  "dep:rustls",
  "dep:tokio-rustls",
  "dep:webpki-roots",
]
# A stand-in for APNs, for tests of the gateway and of a host's sender.
fake-apns = ["server"]

[dependencies]
serde_json.workspace = true
sha2 = "0.10"
base64 = "0.22"
ssh-key = { version = "0.6", features = ["std", "ed25519"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"], optional = true }
hyper = { version = "1", features = ["server", "client", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
ssh-key = { version = "0.6", features = ["std", "ed25519", "rand_core"] }
connecto-push-gateway = { path = ".", features = ["fake-apns"] }
tempfile = "3"

[[bin]]
name = "connecto-push-gateway"
required-features = ["server"]
