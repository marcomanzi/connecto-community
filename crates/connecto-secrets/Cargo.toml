[package]
name = "connecto-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# The Windows Credential Manager through a safe API (the workspace denies
# `unsafe_code`). Without the `search` feature, so no `regex`.
[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = { version = "1.1", default-features = false }
