name: connecto_flutter_app
description: Chat with a project on a paired Connecto host.
publish_to: none
version: 0.2.22+20
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  path_provider: ^2.1.5
  hooks: ^2.2.0
  native_toolchain_rust: ^1.1.1
  file_selector: ^1.1.0
  desktop_drop: ^0.8.4
  connecto_voice:
    path: packages/connecto_voice
  package_info_plus: ^10.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/mark-256.png
