# Builds the release artifacts on native runners. Manual only: it never runs on a
# push, and it never publishes a release; the "only" input limits a run to one
# platform; it uploads the files to the run's
# artifacts so someone can look at them first.
#
# Signing and notarization of the macOS builds use repository secrets if the
# user adds them (see scripts/release/README.md); without them the macOS builds
# are unsigned and say so.
name: release-build

on:
  workflow_dispatch:
    inputs:
      only:
        description: Build only this platform (all = every platform)
        type: choice
        options: [all, macos, linux, windows]
        default: all
      no_relay_token:
        description: Test build with no built-in relay access token (not for release)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  feature-check:
    # The release builds run the same check; this job proves the check itself
    # still trips when the test feature is on, and checks the Linux release graph.
    if: ${{ inputs.only == 'all' || inputs.only == 'linux' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the release feature check
        run: scripts/release/check-release-features.sh --self-test
      - name: Release feature graph (Linux x86_64)
        run: scripts/release/check-release-features.sh x86_64-unknown-linux-gnu

  macos:
    if: ${{ inputs.only == 'all' || inputs.only == 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64, universal]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build
        env:
          CONNECTO_SIGN_IDENTITY: ${{ secrets.CONNECTO_SIGN_IDENTITY }}
          CONNECTO_NOTARY_PROFILE: ${{ secrets.CONNECTO_NOTARY_PROFILE }}
          CONNECTO_RELAY_TOKEN: ${{ secrets.CONNECTO_RELAY_TOKEN }}
          CONNECTO_NO_RELAY_TOKEN: ${{ inputs.no_relay_token && '1' || '' }}
        run: scripts/release/build-macos.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          # The disk image, and the update archive the in-app updater installs
          # (none for universal).
          path: |
            dist/*.dmg
            dist/*.app.zip
          if-no-files-found: error

  linux:
    if: ${{ inputs.only == 'all' || inputs.only == 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libclang-dev pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Build
        env:
          CONNECTO_RELAY_TOKEN: ${{ secrets.CONNECTO_RELAY_TOKEN }}
          CONNECTO_NO_RELAY_TOKEN: ${{ inputs.no_relay_token && '1' || '' }}
        run: scripts/release/build-linux.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    # The runner image has rustup with the stable MSVC toolchain, Visual Studio
    # 2022 (C++ build tools) and a Windows SDK. First run on GitHub: 2026-11-13
    # (run 43433217398, with no_relay_token); the zip started on Windows 11.
    if: ${{ inputs.only == 'all' || inputs.only == 'windows' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Rust target
        run: rustup target add x86_64-pc-windows-msvc
      # Authenticode signing with Azure Artifact Signing, only when the repository
      # variable CONNECTO_WIN_ARTIFACT_SIGNING_ACCOUNT is set (see
      # scripts/release/README.md, "Signing (Windows)"). Without it the zip is unsigned.
      - name: Artifact Signing client (signtool dlib)
        if: ${{ vars.CONNECTO_WIN_ARTIFACT_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          nuget install Microsoft.ArtifactSigning.Client -OutputDirectory $dir -ExcludeVersion -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'nuget install failed' }
          $dlib = Get-ChildItem -Path $dir -Recurse -Filter Azure.CodeSigning.Dlib.dll |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $dlib) { throw 'no x64 Azure.CodeSigning.Dlib.dll in the package' }
          "CONNECTO_WIN_ARTIFACT_SIGNING_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
      - name: Build
        shell: pwsh
        env:
          CONNECTO_RELAY_TOKEN: ${{ secrets.CONNECTO_RELAY_TOKEN }}
          CONNECTO_NO_RELAY_TOKEN: ${{ inputs.no_relay_token && '1' || '' }}
          CONNECTO_WIN_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.CONNECTO_WIN_ARTIFACT_SIGNING_ENDPOINT }}
          CONNECTO_WIN_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.CONNECTO_WIN_ARTIFACT_SIGNING_ACCOUNT }}
          CONNECTO_WIN_ARTIFACT_SIGNING_PROFILE: ${{ vars.CONNECTO_WIN_ARTIFACT_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: scripts/release/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  checksums:
    needs: [macos, linux, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    env:
      HAS_UPDATE_KEY: ${{ secrets.CONNECTO_UPDATE_SIGNING_KEY != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: SHA256SUMS
        run: cd artifacts && sha256sum connecto-* | sort -k2 > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS
      # The signed update feed, when the signing key is set as the repository
      # secret CONNECTO_UPDATE_SIGNING_KEY (see scripts/release/README.md,
      # "Updates"). Without it no feed is made and nothing else changes.
      - uses: actions/checkout@v4
        if: ${{ env.HAS_UPDATE_KEY == 'true' }}
        with:
          path: src
      - name: update.json
        if: ${{ env.HAS_UPDATE_KEY == 'true' }}
        env:
          CONNECTO_UPDATE_SIGNING_KEY: ${{ secrets.CONNECTO_UPDATE_SIGNING_KEY }}
          CONNECTO_DIST: ${{ github.workspace }}/artifacts
        run: src/scripts/release/make-update-feed.sh
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_UPDATE_KEY == 'true' }}
        with:
          name: update-feed
          path: artifacts/update.json
