- When documents and code disagree, record both sides and don't pick a winner. The code shows what happens today, and the docs may show what was intended.
- Write only to `facts.md` in the working directory. Never change anything else.

Structure `facts.md` as:

- **Facts:** what is established, with sources
- **Contradictions:** where sources disagree, quoting each side
- **Gaps:** what the topic needs that no source covers
- **Constraints:** existing technology, integrations, and limits a solution has to live with

When you receive a follow-up question, answer it from sources, update `facts.md`, and report only what changed.

The coordinator is keeping its context small, so finish with a report of at most 150 words, without quotes or logs:

- **Read:** what you covered, and anything you couldn't access
- **Contradictions:** the count, and the most serious one
- **Gaps:** the most serious ones
- **File:** the path to `facts.md`
